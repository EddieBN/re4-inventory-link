<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<title>RE4 Inventory Link</title>
<style>
:root{
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L","Noto Serif",Georgia,serif;
  --ink:#ecebe3; --dim:#9c9a8c; --box:rgb(13,13,13); --hi:rgba(214,204,120,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:var(--serif);overflow:hidden;touch-action:none;overscroll-behavior:none}
#bar{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:calc(6px + env(safe-area-inset-top)) 8px 6px;font:13px system-ui,sans-serif;color:#aaa}
#bar .dot{width:9px;height:9px;border-radius:50%;background:#c0392b}#bar .dot.run{background:#2ecc71}#bar .dot.pause{background:#e5b335}
#bar .sp{flex:1}
.seg{display:inline-flex;border:1px solid #57554a}
.seg button,#bar>button{font:italic 15px var(--serif);color:var(--ink);background:rgba(30,30,26,.9);border:0;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid #57554a}
.seg button.on{background:linear-gradient(180deg,#6b6646,#3b3826);color:#fff}
.seg button.game::after{content:"•";margin-left:3px;color:#e5d27a}
#bar>button{border:1px solid #57554a}
#stage-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.win{position:relative;overflow:hidden;background:#000}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage>img.bg{position:absolute;left:0;top:0;pointer-events:none}
.synthetic{position:absolute;border-radius:14px;background:linear-gradient(180deg,#9c9a90,#5b5a54);box-shadow:inset 0 0 0 10px #3a3935,0 10px 40px #000}
.felt{position:absolute;background:
  repeating-linear-gradient(90deg,rgba(190,190,180,.18) 0 1px,transparent 1px var(--c)),
  repeating-linear-gradient(0deg,rgba(190,190,180,.18) 0 1px,transparent 1px var(--c)),
  radial-gradient(#26262a,#141416)}
.layer{position:absolute;left:0;top:0;pointer-events:none}
.it{position:absolute;left:0;top:0;transform-origin:0 0}
.it img.ic{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.it img.ic.turn{transform-origin:0 0}
.it .fb{position:absolute;inset:3px;border:2px solid rgba(255,255,255,.22);background:rgba(110,110,100,.32);
  display:flex;align-items:center;justify-content:center;text-align:center;font:italic 22px var(--serif);
  color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;padding:4px;line-height:1.05;overflow:hidden}
.nb{position:absolute;background:var(--box);padding:0 6px;font:italic 56px/66px var(--serif);color:#e8e8e0;height:66px}
.eq{position:absolute;left:18px;top:4px;font:italic bold 62px/1 var(--serif);color:#efefe8;text-shadow:0 0 4px #000,2px 2px 2px #000,-1px -1px 2px #000}
.sel{position:absolute;inset:0;background:var(--hi);mix-blend-mode:screen}
.ghost{position:absolute;left:0;top:0;transform-origin:0 0;border:6px solid rgba(110,230,120,.85);background:rgba(110,230,120,.15)}
.ghost.bad{border-color:rgba(235,80,70,.9);background:rgba(235,80,70,.18)}
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;max-width:94vw;
  padding:8px 14px;background:rgba(0,0,0,.8);border:1px solid #57554a;font:italic 16px var(--serif);color:#e6dfb0;text-align:center}
.menu{position:fixed;z-index:30;min-width:150px;padding:6px 0;background:linear-gradient(180deg,rgba(38,38,34,.96),rgba(18,18,16,.96));
  border:1px solid #77756a;box-shadow:0 0 0 1px #000,0 6px 22px rgba(0,0,0,.7);font:italic 20px var(--serif)}
.menu div{padding:7px 18px 7px 26px;position:relative;cursor:pointer;text-shadow:0 0 3px #000}
.menu div.on,.menu div:active{background:linear-gradient(90deg,rgba(210,200,130,.35),rgba(210,200,130,.05))}
.menu div.on::before{content:"";position:absolute;left:9px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid #e8dc9a}
.menu div.off{color:#6d6b62;pointer-events:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:min(640px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#25241f,#151512);border:1px solid #77756a;
  box-shadow:0 0 0 1px #000;padding:18px;touch-action:pan-y}
.panel h2{margin:0 0 4px;font:italic 28px var(--serif);text-shadow:0 0 3px #000}
.panel .sub{color:var(--dim);font-size:15px;margin-bottom:12px}
.big{display:flex;align-items:center;justify-content:center;background:radial-gradient(#2a2a26,#0b0b0a);min-height:140px;margin-bottom:12px;border:1px solid #3c3b34}
.big img{max-width:100%;max-height:40vh}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:17px;margin:6px 0 10px}
.kv b{font-weight:normal;color:var(--dim)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}.pips i{width:13px;height:13px;background:#3a3830;border:1px solid #57554a}.pips i.f{background:#d8c97a}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{flex:1;min-width:110px;padding:10px 12px;font:italic 19px var(--serif);color:var(--ink);background:linear-gradient(180deg,#3b3a33,#22211d);border:1px solid #77756a;cursor:pointer}
.btn:active{background:linear-gradient(180deg,#57553f,#2f2e25)}
.step{display:flex;align-items:center;border:1px solid #77756a;width:max-content}
.step button{width:46px;height:42px;background:#2b2a24;color:var(--ink);border:0;font-size:24px}
.step input{width:76px;height:42px;text-align:center;background:#0d0d0b;color:var(--ink);border:0;font:20px var(--serif);-webkit-user-select:text;user-select:text}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}.row label{min-width:110px;color:var(--dim)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.list div{padding:8px 10px;border:1px solid #3c3b34;background:#1b1a17;font-style:italic}
.toast{position:fixed;left:50%;bottom:calc(54px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;padding:9px 16px;
  background:rgba(20,20,18,.95);border:1px solid #77756a;font:italic 18px var(--serif);opacity:0;transition:opacity .2s;pointer-events:none;max-width:92vw;text-align:center}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="bar">
  <span class="dot" id="dot"></span><span id="stx">conectando…</span>
  <span class="sp"></span>
  <span class="seg" id="sizes"></span>
  <button id="othersBtn">Keys / Treasures</button>
</div>
<div id="stage-wrap"><div class="win" id="win"><div class="stage" id="stage"></div></div></div>
<div class="banner" id="banner" hidden></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ======================================================================
//  Estado
// ======================================================================
let S=null, C=null, cLoading=false;
let preview='auto';        // 'auto' = segue o tamanho da maleta no jogo; ou 0..3
let sel=null, menu=null, drag=null, modal=null;
const PX=96;               // pixels por célula no sistema local de cada item
const SYN=96;              // tamanho da célula na maleta desenhada (quando não há imagem)
const KNIFE=new Set([13,56]);
const NAMES=['S','M','L','XL'];
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
try{ const p=localStorage.getItem('re4-case-preview'); if(p!==null) preview=p==='auto'?'auto':+p; }catch(e){}

// ---------------------------------------------------------- matrizes 3x3
const mul=(A,B)=>A.map(r=>[0,1,2].map(j=>r[0]*B[0][j]+r[1]*B[1][j]+r[2]*B[2][j]));
function inv(m){const[a,b,c]=m[0],[d,e,f]=m[1],[g,h,i]=m[2];const A=e*i-f*h,B=-(d*i-f*g),Cc=d*h-e*g,D=-(b*i-c*h),E=a*i-c*g,F=-(a*h-b*g),G=b*f-c*e,Hh=-(a*f-c*d),I=a*e-b*d;const det=a*A+b*B+c*Cc;return[[A/det,D/det,G/det],[B/det,E/det,Hh/det],[Cc/det,F/det,I/det]]}
const ap=(M,u,v)=>{const x=M[0][0]*u+M[0][1]*v+M[0][2],y=M[1][0]*u+M[1][1]*v+M[1][2],w=M[2][0]*u+M[2][1]*v+M[2][2];return[x/w,y/w]};
const css=M=>`matrix3d(${M[0][0]},${M[1][0]},0,${M[2][0]},${M[0][1]},${M[1][1]},0,${M[2][1]},0,0,1,0,${M[0][2]},${M[1][2]},0,${M[2][2]})`;
const cellT=(x,y)=>[[1/PX,0,x],[0,1/PX,y],[0,0,1]];

// ======================================================================
//  Geometria da maleta exibida
// ======================================================================
function shownLevel(){ return preview==='auto'?S.caseLevel:preview }
function isPreview(){ return preview!=='auto' && preview!==S.caseLevel }
function geometry(){
  const lvl=shownLevel(), c=C.cases[lvl], [W,Hc]=c.size;
  if(c.image&&c.H){
    const M=c.H, pts=[[0,0],[W,0],[0,Hc],[W,Hc]].map(p=>ap(M,...p));
    const x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0])),y0=Math.min(...pts.map(p=>p[1])),y1=Math.max(...pts.map(p=>p[1]));
    const cw=(x1-x0)/W, ch=(y1-y0)/Hc;
    // recorte: só a maleta (tampa em cima, alça embaixo)
    const x=Math.max(0,x0-cw*1.05), y=Math.max(0,y0-ch*2.0);
    const crop={x,y,w:Math.min(c.image.w,x1+cw*1.05)-x,h:Math.min(c.image.h,y1+ch*2.0)-y};
    return {lvl,W,Hc,M,crop,image:c.image,synthetic:false};
  }
  // sem screenshot (ou ainda sem calibração) para esse tamanho: maleta desenhada
  const pad=SYN*0.6, w=W*SYN+pad*2, h=Hc*SYN+pad*2;
  return {lvl,W,Hc,M:[[SYN,0,pad],[0,SYN,pad],[0,0,1]],crop:{x:0,y:0,w,h},image:null,synthetic:true,
          missing:c.image?'calib':'image'};
}

// ======================================================================
//  Render
// ======================================================================
async function loadCases(){
  if(cLoading) return; cLoading=true;
  try{ C=await (await fetch('/api/cases')).json(); }catch(e){}
  cLoading=false; render();
}
function renderBar(){
  const dot=$('#dot'), stx=$('#stx');
  if(!S||!S.connected){ dot.className='dot'; stx.textContent='desconectado'; }
  else { dot.className='dot '+(S.running?'run':'pause'); stx.textContent=S.running?'ao vivo':'pausado'; }
  const g=S&&S.connected?S.caseLevel:-1;
  $('#sizes').innerHTML=`<button data-p="auto" class="${preview==='auto'?'on':''}">Auto</button>`+
    NAMES.map((n,i)=>`<button data-p="${i}" class="${preview===i?'on':''} ${g===i?'game':''}">${n}</button>`).join('');
}
$('#sizes').addEventListener('click',e=>{
  const b=e.target.closest('[data-p]'); if(!b) return;
  preview=b.dataset.p==='auto'?'auto':+b.dataset.p;
  try{localStorage.setItem('re4-case-preview',String(preview))}catch(err){}
  sel=null; closeMenu(); render();
});

let G=null;
function render(){
  renderBar();
  const stage=$('#stage'), banner=$('#banner');
  if(!S||!S.connected){ stage.innerHTML=''; G=null; banner.hidden=false; banner.textContent=(S&&S.error)||'Abra o Resident Evil 4 no PC.'; return; }
  if(!C||C.version!==S.casesVersion){ loadCases(); if(!C) return; }
  G=geometry();
  const top=$('#bar').getBoundingClientRect().height;
  $('#stage-wrap').style.top=top+'px';
  const s=Math.min(innerWidth/G.crop.w,(innerHeight-top-8)/G.crop.h);
  const win=$('#win'); win.style.width=Math.round(G.crop.w*s)+'px'; win.style.height=Math.round(G.crop.h*s)+'px';
  G.s=s;
  stage.style.transform=`scale(${s}) translate(${-G.crop.x}px,${-G.crop.y}px)`;
  let h='';
  if(G.synthetic){
    const pad=SYN*0.6;
    h+=`<div class="synthetic" style="left:${pad*0.35}px;top:${pad*0.35}px;width:${G.crop.w-pad*0.7}px;height:${G.crop.h-pad*0.7}px"></div>`;
    h+=`<div class="felt" style="--c:${SYN}px;left:${pad}px;top:${pad}px;width:${G.W*SYN}px;height:${G.Hc*SYN}px"></div>`;
  } else {
    h+=`<img class="bg" src="${G.image.url}" style="width:${G.image.w}px;height:${G.image.h}px" draggable="false">`;
  }
  h+=`<div class="layer" style="width:${G.crop.x+G.crop.w}px;height:${G.crop.y+G.crop.h}px">`;
  if(!isPreview()){
    for(const it of S.items){ if(drag&&drag.slot===it.slot) continue; h+=itemHTML(it,it.x,it.y,it.rot,it.w,it.h); }
    if(drag&&drag.active){
      const d=drag;
      if(d.cell) h+=`<div class="ghost ${d.ok?'':'bad'}" style="width:${d.w*PX}px;height:${d.h*PX}px;transform:${css(mul(G.M,cellT(d.cell[0],d.cell[1])))}"></div>`;
      h+=itemHTML(d.it,d.fx,d.fy,d.rot,d.w,d.h,true);
    }
  }
  h+='</div>';
  stage.innerHTML=h;
  let msg='';
  if(G.synthetic&&G.missing==='image') msg=`Sem imagem da maleta ${NAMES[G.lvl]} — salve o screenshot em web/cases/${NAMES[G.lvl]}.webp`;
  else if(G.synthetic) msg=`Maleta ${NAMES[G.lvl]} ainda sem grade: abra essa maleta no jogo uma vez para calibrar`;
  if(isPreview()) msg=(msg?msg+' · ':'')+`Prévia da maleta ${NAMES[G.lvl]} — no jogo: ${NAMES[S.caseLevel]}`;
  banner.hidden=!msg; banner.textContent=msg;
  renderMenu();
}

function countOf(it){
  if(it.type===1) return KNIFE.has(it.id)?null:it.ammo;
  if(it.type===2||it.type===3) return it.num;
  return it.num>1?it.num:null;
}
function iconUrl(it){ return C ? (C.icons[String(it.id)]||C.icons[it.key]||C.icons[it.name]||null) : null; }
function itemHTML(it,x,y,rot,w,h,dragging){
  const T=mul(G.M,cellT(x,y));
  const url=iconUrl(it);
  let inner='';
  if(url){
    // o ícone representa o item na orientação padrão; girado, roda 90° dentro da área
    const turned=(rot&1)===1;
    const st=turned?`width:${h*PX}px;height:${w*PX}px;transform:translate(${w*PX}px,0) rotate(90deg)`:'';
    inner+=`<img class="ic ${turned?'turn':''}" src="${url}" style="${st}" draggable="false">`;
  } else inner+=`<div class="fb">${esc(it.name)}</div>`;
  if(it.equipped) inner+=`<div class="eq">E</div>`;
  const n=countOf(it);
  if(n!==null&&n!==undefined) inner+=`<div class="nb" style="right:4px;bottom:6px">${n}</div>`;
  if(sel===it.slot&&!dragging) inner+=`<div class="sel"></div>`;
  return `<div class="it" style="width:${w*PX}px;height:${h*PX}px;transform:${css(T)}${dragging?';opacity:.92':''}">${inner}</div>`;
}

// ======================================================================
//  Menu de opções (Equip / Use / Examine / Discard)
// ======================================================================
function findItem(slot){ return S&&[...S.items,...S.others].find(i=>i.slot===slot) }
function optionsFor(it){
  const o=[];
  if(it.type===1) o.push({k:'equip',t:it.equipped?'Equipped':'Equip',off:it.equipped});
  if(it.type===6) o.push({k:'use',t:'Use'});
  o.push({k:'examine',t:'Examine'});
  o.push({k:'discard',t:'Discard',off:it.type===7||it.type===14||it.equipped});
  o.push({k:'cancel',t:'Cancel'});
  return o;
}
function openMenu(slot,cx,cy){ sel=slot; const o=optionsFor(findItem(slot)); menu={slot,x:cx,y:cy,idx:Math.max(0,o.findIndex(x=>!x.off))}; buzz(10); render(); }
function closeMenu(){ menu=null; renderMenu(); }
function renderMenu(){
  document.querySelectorAll('.menu').forEach(e=>e.remove());
  if(!menu) return;
  const it=findItem(menu.slot); if(!it){menu=null;return}
  const opts=optionsFor(it);
  const el=document.createElement('div'); el.className='menu';
  el.innerHTML=opts.map((o,i)=>`<div class="${i===menu.idx?'on':''} ${o.off?'off':''}" data-k="${o.k}">${o.t}</div>`).join('');
  document.body.appendChild(el);
  const r=el.getBoundingClientRect();
  let x=menu.x+14, y=menu.y-r.height/2;
  if(x+r.width>innerWidth-6) x=menu.x-r.width-14;
  x=Math.max(6,Math.min(innerWidth-r.width-6,x)); y=Math.max(6,Math.min(innerHeight-r.height-6,y));
  el.style.left=x+'px'; el.style.top=y+'px';
  el.addEventListener('pointerdown',e=>e.stopPropagation());
  el.addEventListener('click',e=>{const d=e.target.closest('[data-k]'); if(d) action(d.dataset.k,it)});
}
async function action(k,it){
  closeMenu();
  if(k==='cancel'){ sel=null; render(); return; }
  if(k==='equip'){ try{const j=await api('/api/equip',{slot:it.slot}); toast(j.pending?'Troca agendada — volte ao jogo':'Equipped: '+it.name);}catch(e){toast(e.message)} return; }
  if(k==='use'){ try{const j=await api('/api/use',{slot:it.slot}); toast(`Life ${j.hp[0]} → ${j.hp[1]}${j.hpMax[1]!==j.hpMax[0]?` (max ${j.hpMax[1]})`:''}`); buzz(30);}catch(e){toast(e.message)} return; }
  if(k==='discard') return confirmDiscard(it);
  if(k==='examine') return examine(it);
}

// ======================================================================
//  Modais
// ======================================================================
function openModal(html){ closeModal(); modal=document.createElement('div'); modal.className='modal'; modal.innerHTML=`<div class="panel">${html}</div>`;
  modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); }); modal.addEventListener('pointerdown',e=>e.stopPropagation()); document.body.appendChild(modal); return modal; }
function closeModal(){ if(modal){modal.remove();modal=null;} }
function confirmDiscard(it){
  const m=openModal(`<h2>Discard ${esc(it.name)}?</h2><div class="sub">O item será removido do inventário.</div><div class="btns"><button class="btn" data-a="yes">Yes</button><button class="btn" data-a="no">No</button></div>`);
  m.addEventListener('click',async e=>{const b=e.target.closest('[data-a]'); if(!b) return; closeModal();
    if(b.dataset.a==='yes'){ try{await api('/api/discard',{slot:it.slot}); sel=null; toast('Discarded: '+it.name);}catch(err){toast(err.message)} } });
}
const pips=(n,max=5)=>`<span class="pips">${Array.from({length:max},(_,i)=>`<i class="${i<n?'f':''}"></i>`).join('')}</span>`;
function examine(it){
  const url=iconUrl(it);
  let body=url?`<div class="big"><img src="${url}"></div>`:'';
  body+=`<h2>${esc(it.name)}</h2><div class="sub">${esc(it.typeName||'')}</div><div class="kv">`;
  if(it.type===1){
    if(!KNIFE.has(it.id)) body+=`<b>Ammo</b><span>${it.ammo} / ${it.ammoMax??'?'}</span>`;
    body+=`<b>Firepower</b><span>${pips(it.firepower)}</span><b>Firing speed</b><span>${pips(it.firingSpeed)}</span><b>Reload speed</b><span>${pips(it.reloadSpeed)}</span><b>Capacity</b><span>${pips(it.capacity)}</span>`;
  } else if(it.num>1||it.max>1) body+=`<b>Quantidade</b><span>${it.num}${it.max>1?' / '+it.max:''}</span>`;
  body+=`</div><div class="btns"><button class="btn" data-a="adj">Ajustes…</button><button class="btn" data-a="back">Back</button></div>`;
  const m=openModal(body);
  m.addEventListener('click',e=>{const b=e.target.closest('[data-a]'); if(!b) return; if(b.dataset.a==='back') closeModal(); else adjust(it.slot); });
}
function adjust(slot){
  const it=findItem(slot); if(!it) return closeModal();
  const isAmmo=it.type===1&&!KNIFE.has(it.id);
  let body=`<h2>Ajustes — ${esc(it.name)}</h2><div class="sub">Edição direta dos valores na memória do jogo.</div>`;
  if(isAmmo) body+=`<div class="row"><label>Munição</label><div class="step"><button data-d="-1">−</button><input id="adjIn" type="number" inputmode="numeric" value="${it.ammo}"><button data-d="1">+</button></div><span>/ ${it.ammoMax??'?'}</span></div>`;
  else if(it.type!==1&&it.max>1) body+=`<div class="row"><label>Quantidade</label><div class="step"><button data-d="-1">−</button><input id="adjIn" type="number" inputmode="numeric" value="${it.num}"><button data-d="1">+</button></div><span>máx ${it.max}</span></div>`;
  else body+=`<div class="sub">Nada ajustável neste item.</div>`;
  body+=`<div class="btns"><button class="btn" data-a="ok">OK</button></div>`;
  const m=openModal(body);
  const send=async v=>{ try{ await api(isAmmo?'/api/ammo':'/api/count',isAmmo?{slot,ammo:v}:{slot,num:v}); }catch(e){toast(e.message)} };
  let tmr=null;
  m.addEventListener('click',e=>{
    const d=e.target.closest('[data-d]');
    if(d){const inp=$('#adjIn'); const mx=isAmmo?(it.ammoMax??999):it.max; inp.value=Math.max(isAmmo?0:1,Math.min(mx,(+inp.value||0)+(+d.dataset.d))); clearTimeout(tmr); tmr=setTimeout(()=>send(+inp.value),200); buzz(8); return;}
    if(e.target.closest('[data-a]')) closeModal();
  });
  m.addEventListener('input',e=>{ if(e.target.id==='adjIn'){clearTimeout(tmr); tmr=setTimeout(()=>send(+e.target.value||0),350);} });
}
$('#othersBtn').addEventListener('click',()=>{
  if(!S||!S.connected) return;
  const groups={};
  for(const o of S.others){const g=o.type===5||o.type===12||o.type===13?'Treasures':o.type===10?'Files':'Keys';(groups[g]=groups[g]||[]).push(o);}
  let h='<h2>Keys / Treasures</h2>';
  for(const [g,l] of Object.entries(groups)) h+=`<div class="sub" style="margin-top:10px">${g}</div><div class="list">${l.map(o=>`<div>${esc(o.name)}${o.num>1?' ×'+o.num:''}</div>`).join('')}</div>`;
  h+='<div class="btns"><button class="btn" data-a="x">Back</button></div>';
  const m=openModal(h); m.addEventListener('click',e=>{if(e.target.closest('[data-a]')) closeModal();});
});

// ======================================================================
//  Toque, segurar-e-arrastar, girar com dois dedos
// ======================================================================
function cellAt(e){
  if(!G) return null; const r=$('#win').getBoundingClientRect();
  return ap(inv(G.M),(e.clientX-r.left)/G.s+G.crop.x,(e.clientY-r.top)/G.s+G.crop.y);
}
function itemAtCell(u,v){ return S.items.find(i=>u>=i.x&&u<i.x+i.w&&v>=i.y&&v<i.y+i.h) }
function occupied(except){ const o=new Set(); for(const i of S.items) if(i.slot!==except) for(let a=0;a<i.w;a++) for(let b=0;b<i.h;b++) o.add((i.x+a)+','+(i.y+b)); return o; }
function fits(occ,x,y,w,h){ if(x<0||y<0||x+w>S.caseW||y+h>S.caseH) return false; for(let a=0;a<w;a++) for(let b=0;b<h;b++) if(occ.has((x+a)+','+(y+b))) return false; return true; }

const pointers=new Map();
const win=$('#win');
win.onpointerdown=e=>{
  if(modal||!S||!S.connected||isPreview()) return;
  try{ win.setPointerCapture(e.pointerId); }catch(err){}
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag&&drag.active&&pointers.size===2){ const [a,b]=[...pointers.values()]; drag.ang0=Math.atan2(b.y-a.y,b.x-a.x); drag.turns=0; return; }
  if(pointers.size>1) return;
  const c=cellAt(e); if(!c) return;
  const it=itemAtCell(c[0],c[1]);
  if(menu){ closeMenu(); if(!it){ sel=null; render(); return; } }
  if(!it){ if(sel!==null){sel=null;render();} return; }
  drag={slot:it.slot,it,active:false,start:[e.clientX,e.clientY],grab:[c[0]-it.x,c[1]-it.y],rot:it.rot,w:it.w,h:it.h,fx:it.x,fy:it.y,
        timer:setTimeout(()=>{ if(drag&&!drag.active) beginDrag(e); },e.pointerType==='mouse'?220:320)};
};
win.onpointermove=e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag) return;
  if(!drag.active){ if(Math.hypot(e.clientX-drag.start[0],e.clientY-drag.start[1])>14){ clearTimeout(drag.timer); drag=null; } return; }
  if(pointers.size>=2&&drag.ang0!==undefined){
    const [a,b]=[...pointers.values()]; let d=Math.atan2(b.y-a.y,b.x-a.x)-drag.ang0; d=Math.atan2(Math.sin(d),Math.cos(d));
    const steps=Math.round(d/(Math.PI/2)); // cada 90° (limiar em 45°) gira o item
    if(steps!==drag.turns){ if((steps-drag.turns)%2!==0) rotateDrag(); drag.turns=steps; }
    return;
  }
  drag.ptr=[e.clientX,e.clientY]; updateDrag(cellAt(e)); render();
};
win.onpointerup=e=>{
  pointers.delete(e.pointerId);
  if(!drag) return;
  if(!drag.active){ clearTimeout(drag.timer); const it=drag.it; drag=null; openMenu(it.slot,e.clientX,e.clientY); return; }
  if(pointers.size>0) return;
  finishDrag();
};
win.onpointercancel=e=>{ pointers.delete(e.pointerId); if(drag&&!drag.active){clearTimeout(drag.timer);drag=null;} else if(drag&&pointers.size===0){drag=null;render();} };
win.oncontextmenu=e=>{ e.preventDefault(); if(drag&&drag.active) rotateDrag(); };
win.onwheel=e=>{ if(drag&&drag.active){ e.preventDefault(); rotateDrag(); } };
function beginDrag(e){ closeMenu(); sel=null; drag.active=true; buzz(18); drag.ptr=[e.clientX,e.clientY]; updateDrag(cellAt(e)); render(); }
function updateDrag(c){
  if(!c) return;
  drag.fx=c[0]-drag.grab[0]; drag.fy=c[1]-drag.grab[1];
  const x=Math.round(drag.fx), y=Math.round(drag.fy);
  drag.cell=[x,y]; drag.ok=fits(occupied(drag.slot),x,y,drag.w,drag.h);
}
function rotateDrag(){
  drag.rot=drag.rot^1; [drag.w,drag.h]=[drag.h,drag.w];
  drag.grab=[Math.min(drag.grab[1],drag.w-0.5),Math.min(drag.grab[0],drag.h-0.5)];
  buzz(12);
  if(drag.ptr) updateDrag(cellAt({clientX:drag.ptr[0],clientY:drag.ptr[1]}));
  render();
}
async function finishDrag(){
  const d=drag; drag=null;
  if(d.cell&&d.ok&&(d.cell[0]!==d.it.x||d.cell[1]!==d.it.y||d.rot!==d.it.rot)){
    try{ await api('/api/move',{slot:d.slot,x:d.cell[0],y:d.cell[1],rot:d.rot}); buzz(); }catch(err){ toast(err.message); }
  }
  render();
}
document.addEventListener('pointerdown',e=>{ if(menu&&!e.target.closest('.menu')&&!e.target.closest('#win')) closeMenu(); });
document.addEventListener('keydown',e=>{ if((e.key==='r'||e.key==='R')&&drag&&drag.active) rotateDrag(); if(e.key==='Escape'){closeMenu();closeModal();} });

// ======================================================================
//  Rede
// ======================================================================
async function api(path,body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({ok:false,error:'Resposta inválida'}));
  if(!j.ok) throw new Error(j.error||'Erro'); return j;
}
function toast(m){const t=$('#toast');t.textContent=m;t.className='toast show';clearTimeout(t._h);t._h=setTimeout(()=>t.className='toast',2400)}
function buzz(ms=15){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
let lastJson='';
function onState(js){
  if(js===lastJson) return; lastJson=js;
  S=JSON.parse(js);
  if(sel!==null&&!findItem(sel)) sel=null;
  if(!drag||!drag.active) render();
}
function connect(){
  const es=new EventSource('/api/events');
  es.onmessage=ev=>onState(ev.data);
  es.onerror=()=>{es.close();$('#dot').className='dot';$('#stx').textContent='reconectando…';setTimeout(connect,1500)};
}
addEventListener('resize',()=>{ if(S) render(); });
connect();
</script>
